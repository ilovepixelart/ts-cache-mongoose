name: PR check

on:
  workflow_dispatch:
  # Pull requests, plus the commit each merge lands on main. Feature branches run
  # through their pull request only.
  push:
    branches:
      - main

  pull_request:
    types: [opened, synchronize, reopened]

# Declare default permissions as read only. No job in this workflow writes to
# the repo: tests, biome, type-check, coverage, and SonarCloud all run in
# read-only mode. SonarCloud PR decorations come from the SonarCloud GitHub
# App, not GITHUB_TOKEN write scopes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    services:
      # Label used to access the service container
      redis:
        # Docker Hub image, pinned to a major
        image: redis:8-alpine
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps port 6379 on service container to the host
          - 6379:6379

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
        mongoose-version:
          [
            [mongoose@6.12.2, bson@^4.7.2],
            [mongoose@7.6.4, bson@^5.5.0],
            [mongoose@8.23.0, bson@^6.10.4],
            [mongoose@9.4.1, bson@^7.0.0],
          ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Disabling shallow clone is recommended for improving relevancy of reporting
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # No dependency install scripts; the one the tests need runs explicitly next.
      - name: Installing dependencies
        run: npm ci --ignore-scripts

      # Fetch the MongoDB binary once, before the parallel test workers race to
      # download it on first use.
      - name: Download the MongoDB binary
        run: node node_modules/mongodb-memory-server/postinstall.js

      # Deliberately outside the lockfile: each cell swaps in one supported mongoose major.
      - name: Installing ${{ matrix.mongoose-version[0] }} ${{ matrix.mongoose-version[1] }} # zizmor: ignore[adhoc-packages]
        env:
          MONGOOSE: ${{ matrix.mongoose-version[0] }}
          BSON: ${{ matrix.mongoose-version[1] }}
        run: npm i --ignore-scripts "$MONGOOSE" "$BSON"

      - name: Type check
        run: npm run type:check

      - name: Coverage
        run: npm run test
        env:
          # The hostname used to communicate with the Redis service container
          REDIS_HOST: localhost
          # The default Redis port
          REDIS_PORT: 6379

  sonar:
    name: Biome, Coverage & Sonar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    services:
      # Label used to access the service container
      redis:
        # Docker Hub image, pinned to a major
        image: redis:8-alpine
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps port 6379 on service container to the host
          - 6379:6379

    strategy:
      fail-fast: false
      matrix:
        node-version: [26.x]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Disabling shallow clone is recommended for improving relevancy of reporting
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # No dependency install scripts; the one the tests need runs explicitly next.
      - name: Installing dependencies
        run: npm ci --ignore-scripts

      # Fetch the MongoDB binary once, before the parallel test workers race to
      # download it on first use.
      - name: Download the MongoDB binary
        run: node node_modules/mongodb-memory-server/postinstall.js

      - name: Verify provenance signatures
        run: npm audit signatures

      - name: Biome
        run: npm run biome

      - name: Type check tests
        run: npm run type:check:tests

      - name: Build
        run: npm run build

      # publint checks package.json against the files it ships; attw resolves the
      # packed types under every module resolution mode.
      - name: Package lint
        run: npm run lint:package

      - name: Coverage
        run: npm run test
        env:
          # The hostname used to communicate with the Redis service container
          REDIS_HOST: localhost
          # The default Redis port
          REDIS_PORT: 6379

      # Skipped when SONAR_TOKEN is absent (forks, Dependabot), so the check stays green there.
      - name: Scan
        if: env.SONAR_TOKEN
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=ilovepixelart
            -Dsonar.projectName=${{ github.event.repository.name }}
            -Dsonar.projectKey=ilovepixelart_${{ github.event.repository.name }}
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.test.exclusions=tests/**
            -Dsonar.coverage.exclusions=tests/**
            -Dsonar.qualitygate.wait=true

  # The packed package installed into a consumer project of its own, through require() and
  # import, against a real MongoDB replica set and Redis, compared with the published release.
  e2e:
    name: E2E ${{ matrix.mongoose-version[0] }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    services:
      # Label used to access the service container
      redis:
        # Docker Hub image, pinned to a major
        image: redis:8-alpine
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps port 6379 on service container to the host
          - 6379:6379

    strategy:
      fail-fast: false
      matrix:
        mongoose-version:
          [
            [mongoose@6.12.2, bson@^4.7.2],
            [mongoose@7.6.4, bson@^5.5.0],
            [mongoose@8.23.0, bson@^6.10.4],
            [mongoose@9.4.1, bson@^7.0.0],
          ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm

      # No dependency install scripts; the one the run needs comes next.
      - name: Installing dependencies
        run: npm ci --ignore-scripts

      - name: Download the MongoDB binary
        run: node node_modules/mongodb-memory-server/postinstall.js

      # Builds and packs the package, installs it with the matrix peers into a consumer
      # project outside the repository, and runs every scenario group there.
      - name: E2E
        run: npm run test:e2e
        env:
          E2E_MONGOOSE: ${{ matrix.mongoose-version[0] }}
          E2E_BSON: ${{ matrix.mongoose-version[1] }}
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  zizmor:
    name: Workflow audit (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Audit workflows
        run: uvx zizmor@1.32.0 --format=plain --config .github/zizmor.yml .github

  # The one check branch rules require: it fails unless every job above succeeded.
  ci:
    name: CI
    needs: [tests, sonar, e2e, zizmor]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "Jobs that did not succeed:" >&2
            echo "$failed" >&2
            exit 1
          fi
          echo "All jobs succeeded."
